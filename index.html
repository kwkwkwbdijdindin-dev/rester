<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nungguin Yaa</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

.marquee {
    width: 100vw;
    height: 100vh;

    display: flex;
    align-items: center;

    overflow: hidden;
    white-space: nowrap;
}

.marquee-text {
    display: inline-block;

    font-family: Arial, sans-serif;
    font-size: clamp(70px, 15vw, 220px);
    font-weight: 900;
    text-transform: uppercase;

    animation: jalan 8s linear infinite;

    background: linear-gradient(
        90deg,
        #ff0055,
        #ff00ff,
        #0066ff,
        #00ffff,
        #00ff66,
        #ffff00,
        #ff0055
    );

    background-size: 400% 100%;

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    animation:
        jalan 8s linear infinite,
        rgb 3s linear infinite;

    text-shadow:
        0 0 20px rgba(255, 0, 100, .5);
}

@keyframes jalan {
    from {
        transform: translateX(100vw);
    }

    to {
        transform: translateX(-100%);
    }
}

@keyframes rgb {
    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}
</style>
</head>

<body>

<div class="marquee">
    <div class="marquee-text">
        NUNGUIN YAA
    </div>
</div>

</body>
</html>
